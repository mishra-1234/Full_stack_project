<div class="login-page">

  <!-- Top Navigation Header -->
  <header class="top-nav">
    <a routerLink="/" class="nav-brand">
      <span class="brand-store-icon">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M3 9L4.5 4H19.5L21 9M3 9V20C3 20.55 3.45 21 4 21H20C20.55 21 21 20.55 21 20V9M3 9H21M9 21V14H15V21" stroke="#FBB03B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3 9C3 10.1 3.9 11 5 11C6.1 11 7 10.1 7 9C7 10.1 7.9 11 9 11C10.1 11 11 10.1 11 9C11 10.1 11.9 11 13 11C14.1 11 15 10.1 15 9C15 10.1 15.9 11 17 11C18.1 11 19 10.1 19 9" stroke="#FBB03B" stroke-width="1.8"/>
        </svg>
      </span>
      <span class="nav-brand-text">Bazario</span>
    </a>
  </header>

  <!-- Ambient background glow & Marketplace watermark floating particles -->
  <div class="bg-shapes" aria-hidden="true">
    <span class="shape shape-a"></span>
    <span class="shape shape-b"></span>
    <span class="shape shape-c"></span>
    <div class="bg-grid"></div>

    <!-- Floating Watermark Particles -->
    <div class="watermark-particle p1">
      <svg viewBox="0 0 24 24" fill="none"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="watermark-particle p2">
      <svg viewBox="0 0 24 24" fill="none"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z" stroke="currentColor" stroke-width="1.8"/><line x1="7" y1="7" x2="7.01" y2="7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
    </div>
    <div class="watermark-particle p3">
      <svg viewBox="0 0 24 24" fill="none"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke="currentColor" stroke-width="1.8"/><polyline points="9 22 9 12 15 12 15 22" stroke="currentColor" stroke-width="1.8"/></svg>
    </div>
    <div class="watermark-particle p4">
      <svg viewBox="0 0 24 24" fill="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </div>
    <div class="watermark-particle p5">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="21" r="1" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="21" r="1" stroke="currentColor" stroke-width="2"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </div>
    <div class="watermark-particle p6">
      <svg viewBox="0 0 24 24" fill="none"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" stroke="currentColor" stroke-width="1.8"/><polyline points="3.27 6.96 12 12.01 20.73 6.96" stroke="currentColor" stroke-width="1.8"/><line x1="12" y1="22.08" x2="12" y2="12" stroke="currentColor" stroke-width="1.8"/></svg>
    </div>
    <div class="watermark-particle p7">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </div>
    <div class="watermark-particle p8">
      <svg viewBox="0 0 24 24" fill="none"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </div>
  </div>

  <div class="login-wrapper">

    <div class="login-card">

      <!-- Brand Store Icon Header -->
      <div class="login-brand">
        <div class="store-badge">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M3 9L4.5 4H19.5L21 9M3 9V20C3 20.55 3.45 21 4 21H20C20.55 21 21 20.55 21 20V9M3 9H21M9 21V14H15V21" stroke="#FBB03B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M3 9C3 10.1 3.9 11 5 11C6.1 11 7 10.1 7 9C7 10.1 7.9 11 9 11C10.1 11 11 10.1 11 9C11 10.1 11.9 11 13 11C14.1 11 15 10.1 15 9C15 10.1 15.9 11 17 11C18.1 11 19 10.1 19 9" stroke="#FBB03B" stroke-width="2"/>
          </svg>
        </div>
      </div>

      <div class="login-head">
        <h1 class="login-title">Welcome back</h1>
        <p class="login-sub">Log in to manage orders across your marketplace.</p>
      </div>

      <!-- Success message -->
      <div class="alert alert-success" *ngIf="successMessage" role="status">
        <span class="alert-icon">✓</span>
        <span>{{ successMessage }}</span>
      </div>

      <!-- Error message -->
      <div class="alert alert-error" *ngIf="errorMessage" role="alert">
        <span class="alert-icon">!</span>
        <span>{{ errorMessage }}</span>
      </div>

      <form class="login-form" #loginForm="ngForm" (ngSubmit)="login(loginForm)" novalidate>

        <!-- Email -->
        <div class="field-group">
          <label for="email" class="field-label">Email address</label>
          <div class="input-shell" [class.has-error]="showEmailError">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M3 6.5C3 5.67 3.67 5 4.5 5h15c.83 0 1.5.67 1.5 1.5v11c0 .83-.67 1.5-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5v-11Z" stroke="currentColor" stroke-width="1.6"/>
              <path d="m4 6.5 8 6.5 8-6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <input
              id="email"
              name="email"
              type="email"
              class="field-input"
              placeholder="Email address"
              autocomplete="email"
              [(ngModel)]="email"
              #emailModel="ngModel"
              required
              [attr.aria-invalid]="showEmailError"
              aria-describedby="email-error"
            />
          </div>
          <span class="field-error" id="email-error" *ngIf="showEmailError">
            Please enter a valid email address.
          </span>
        </div>

        <!-- Password -->
        <div class="field-group">
          <label for="password" class="field-label">Password</label>
          <div class="input-shell" [class.has-error]="showPasswordError">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="4" y="10.5" width="16" height="9.5" rx="2" stroke="currentColor" stroke-width="1.6"/>
              <path d="M7.5 10.5V7.75a4.5 4.5 0 0 1 9 0V10.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <input
              id="password"
              name="password"
              [type]="showPassword ? 'text' : 'password'"
              class="field-input"
              placeholder="Password"
              autocomplete="current-password"
              [(ngModel)]="password"
              #passwordModel="ngModel"
              required
              [attr.aria-invalid]="showPasswordError"
              aria-describedby="password-error"
            />
            <button
              type="button"
              class="toggle-visibility"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            >
              <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="1.6"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
              </svg>
              <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M3 3l18 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <path d="M10.6 5.2A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a15.6 15.6 0 0 1-3.6 4.4M7 6.4C4 8.1 2 12 2 12a13.6 13.6 0 0 0 4.3 4.9A10.7 10.7 0 0 0 12 19c1 0 1.9-.1 2.8-.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <path d="M9.9 10a3 3 0 0 0 4.1 4.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <span class="field-error" id="password-error" *ngIf="showPasswordError">
            Password is required.
          </span>
        </div>

        <!-- Remember me & Forgot Password Row -->
        <div class="field-row">
          <label class="checkbox-row">
            <input type="checkbox" name="rememberMe" [(ngModel)]="rememberMe" />
            <span class="checkbox-box">
              <svg class="check-icon" viewBox="0 0 14 14" fill="none">
                <path d="M2.5 7L5.5 10L11.5 4" stroke="#181133" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="checkbox-label">Remember me</span>
          </label>
          <a routerLink="/forgot-password" class="forgot-link">Forgot password?</a>
        </div>

        <!-- Submit -->
        <button
          type="submit"
          class="login-btn"
          [disabled]="isLoading || (submitted && !isFormValid)"
        >
          <span class="btn-spinner" *ngIf="isLoading"></span>
          <span>{{ isLoading ? 'Logging in…' : 'Log In' }}</span>
        </button>

      </form>

      <p class="signup-line">
        Don't have an account?
        <a routerLink="/signup" class="signup-link">Sign Up</a>
      </p>

    </div>

    <p class="login-footnote">
      © {{ currentYear }} Bazario · Multi-Vendor Order Orchestration
    </p>

  </div>
</div>
