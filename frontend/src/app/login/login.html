<div class="login-page">

  <!-- Ambient background shapes -->
  <div class="bg-shapes" aria-hidden="true">
    <span class="shape shape-a"></span>
    <span class="shape shape-b"></span>
    <span class="shape shape-c"></span>
    <div class="bg-grid"></div>
  </div>

  <div class="login-wrapper">

    <div class="login-card">

      <!-- Brand -->
      <div class="login-brand">
        <span class="brand-mark">
          <span class="stall-roof"></span>
          <span class="stall-counter"></span>
        </span>
        <span class="brand-name">Bazario</span>
      </div>

      <div class="login-head">
        <h1 class="login-title">Welcome back</h1>
        <p class="login-sub">Log in to manage orders across your marketplace.</p>
      </div>

      <!-- Success message -->
      <div class="alert alert-success" *ngIf="successMessage" role="status">
        <span class="alert-icon">✓</span>
        <span>{{ successMessage }}</span>
      </div>

      <!-- Error message -->
      <div class="alert alert-error" *ngIf="errorMessage" role="alert">
        <span class="alert-icon">!</span>
        <span>{{ errorMessage }}</span>
      </div>

      <form class="login-form" #loginForm="ngForm" (ngSubmit)="login(loginForm)" novalidate>

        <!-- Email -->
        <div class="field-group">
          <label for="email" class="field-label">Email address</label>
          <div class="input-shell" [class.has-error]="showEmailError">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M3 6.5C3 5.67 3.67 5 4.5 5h15c.83 0 1.5.67 1.5 1.5v11c0 .83-.67 1.5-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5v-11Z" stroke="currentColor" stroke-width="1.6"/>
              <path d="m4 6.5 8 6.5 8-6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <input
              id="email"
              name="email"
              type="email"
              class="field-input"
              placeholder="you@company.com"
              autocomplete="email"
              [(ngModel)]="email"
              #emailModel="ngModel"
              required
              [attr.aria-invalid]="showEmailError"
              aria-describedby="email-error"
            />
          </div>
          <span class="field-error" id="email-error" *ngIf="showEmailError">
            Please enter a valid email address.
          </span>
        </div>

        <!-- Password -->
        <div class="field-group">
          <div class="field-label-row">
            <label for="password" class="field-label">Password</label>
            <a routerLink="/forgot-password" class="forgot-link">Forgot password?</a>
          </div>
          <div class="input-shell" [class.has-error]="showPasswordError">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="4" y="10.5" width="16" height="9.5" rx="2" stroke="currentColor" stroke-width="1.6"/>
              <path d="M7.5 10.5V7.75a4.5 4.5 0 0 1 9 0V10.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <input
              id="password"
              name="password"
              [type]="showPassword ? 'text' : 'password'"
              class="field-input"
              placeholder="Enter your password"
              autocomplete="current-password"
              [(ngModel)]="password"
              #passwordModel="ngModel"
              required
              [attr.aria-invalid]="showPasswordError"
              aria-describedby="password-error"
            />
            <button
              type="button"
              class="toggle-visibility"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            >
              <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="1.6"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
              </svg>
              <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M3 3l18 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <path d="M10.6 5.2A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a15.6 15.6 0 0 1-3.6 4.4M7 6.4C4 8.1 2 12 2 12a13.6 13.6 0 0 0 4.3 4.9A10.7 10.7 0 0 0 12 19c1 0 1.9-.1 2.8-.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <path d="M9.9 10a3 3 0 0 0 4.1 4.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <span class="field-error" id="password-error" *ngIf="showPasswordError">
            Password is required.
          </span>
        </div>

        <!-- Remember me -->
        <div class="field-row">
          <label class="checkbox-row">
            <input type="checkbox" name="rememberMe" [(ngModel)]="rememberMe" />
            <span class="checkbox-box"></span>
            <span class="checkbox-label">Remember me</span>
          </label>
        </div>

        <!-- Submit -->
        <button
          type="submit"
          class="login-btn"
          [disabled]="isLoading || (submitted && !isFormValid)"
        >
          <span class="btn-spinner" *ngIf="isLoading"></span>
          <span>{{ isLoading ? 'Logging in…' : 'Log In' }}</span>
        </button>

      </form>

      <p class="signup-line">
        Don't have an account?
        <a routerLink="/signup" class="signup-link">Sign Up</a>
      </p>

    </div>

    <p class="login-footnote">
      © {{ currentYear }} Bazario · Multi-Vendor Order Orchestration
    </p>

  </div>
</div>
