<header class="site-header" [class.scrolled]="isScrolled">

  <!-- Thin top strip: scrolling vendor categories + trust tagline -->
  <div class="header-strip">
    <div class="strip-track" aria-hidden="true">
      <span class="strip-item" *ngFor="let cat of categories">{{ cat }}</span>
      <span class="strip-item" *ngFor="let cat of categories">{{ cat }}</span>
    </div>
    <div class="strip-tagline">
      <span class="dot"></span>
      Bharat's Trusted Multi-Vendor Marketplace
    </div>
  </div>

  <!-- Main header row -->
  <div class="header-main">

    <a class="brand" routerLink="/" aria-label="Bazario home">
      <span class="brand-mark">
        <span class="stall-roof"></span>
        <span class="stall-counter"></span>
      </span>
      <span class="brand-name">Bazario</span>
    </a>

    <nav class="main-nav" aria-label="Primary">
      <a routerLink="/" class="nav-link">Home</a>
      <a routerLink="/categories" class="nav-link">Categories</a>
      <a routerLink="/sell" class="nav-link">Sell With Us</a>
      <a routerLink="/help" class="nav-link">Help</a>
    </nav>

    <div class="header-actions">
      @if (authService.isLoggedIn()) {
        <div class="user-profile-menu">
          <div class="user-badge">
            <span class="user-avatar">{{ userInitial }}</span>
            <div class="user-info">
              <span class="user-name">{{ userName }}</span>
              @if (userRole) {
                <span class="user-role">{{ userRole }}</span>
              }
            </div>
          </div>
          <button type="button" (click)="logout()" class="btn btn-logout" title="Sign out">
            <svg class="logout-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span>Logout</span>
          </button>
        </div>
      } @else {
        <a routerLink="/login" class="btn btn-ghost">Login</a>
        <a routerLink="/signup" class="btn btn-solid">Sign Up</a>
      }
    </div>

  </div>
</header>
